name: Container image

# Builds and tests docker/image on every change to it. Publishes
# ghcr.io/pixeloven/pi-web only from main and from image-v* tags.
on:
  pull_request:
    paths:
      - docker/image/**
      - .github/workflows/container-image.yml
  push:
    branches: [main]
    paths:
      - docker/image/**
      - .github/workflows/container-image.yml
    tags:
      - image-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/pixeloven/pi-web
  CONTEXT: docker/image

jobs:
  stream-copy-patch:
    name: Opt-in stream-copy patch applies to the pinned release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unit tests
        run: node --test docker/image/build/patch-session-archive.test.mjs

      - name: Transform the pinned upstream source
        run: |
          version=$(sed -n 's/^ARG PI_WEB_VERSION=//p' "$CONTEXT/Dockerfile")
          curl -fsSL "https://raw.githubusercontent.com/jmfederico/pi-web/v${version}/src/server/sessions/sessionArchiveStore.ts" \
            -o "$RUNNER_TEMP/sessionArchiveStore.ts"
          node docker/image/build/patch-session-archive.mjs "$RUNNER_TEMP/sessionArchiveStore.ts"

  examples:
    name: Compose and Kubernetes examples are valid
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compose
        run: docker compose -f docker/image/examples/compose/compose.yml config --quiet

      - name: Kubernetes
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          kubectl kustomize docker/image/examples/kubernetes | ./kubeconform -strict -summary -

  test:
    name: Build and contract-test the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: pi-web:ci
          cache-from: type=gha,scope=pi-web-image
          cache-to: type=gha,scope=pi-web-image,mode=max

      - name: Contract test
        run: docker/image/test/image-contract.sh pi-web:ci

  publish:
    name: Publish to GHCR
    needs: [stream-copy-patch, examples, test]
    if: github.event_name == 'push' && github.repository == 'pixeloven/pi-web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read the pinned PI WEB version
        id: pin
        run: echo "version=$(sed -n 's/^ARG PI_WEB_VERSION=//p' "$CONTEXT/Dockerfile")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=${{ steps.pin.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=match,pattern=image-v(.*),group=1
          labels: |
            org.opencontainers.image.title=pi-web
            org.opencontainers.image.version=${{ steps.pin.outputs.version }}

      # Same context and cache as the test job, so this reuses the tested layers.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pi-web-image
