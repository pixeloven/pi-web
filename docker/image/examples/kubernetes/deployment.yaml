# PI WEB on Kubernetes: one pod with two containers from the same image.
# `sessiond` owns Pi sessions; `server` serves the UI and API and talks to
# sessiond over a Unix socket on a pod-local emptyDir. All state lives on one
# PersistentVolumeClaim mounted as the home directory. See ../../README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-web
  labels:
    app.kubernetes.io/name: pi-web
spec:
  # PI WEB is single-user and sessiond owns live session state: never run two
  # pods against the same volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sessiond
          # Pin a version and digest instead of latest:
          #   ghcr.io/pixeloven/pi-web:<version>@sha256:<digest>
          image: ghcr.io/pixeloven/pi-web:latest
          args: ["sessiond"]
          env:
            - name: PI_WEB_SESSIOND_SOCKET
              value: /run/pi-web/sessiond.sock
          # Optional settings and secrets, by name. Create either with
          # kubectl (see README); the pod starts without them.
          envFrom:
            - configMapRef:
                name: pi-web-config
                optional: true
            - secretRef:
                name: pi-web-secrets
                optional: true
          readinessProbe:
            exec:
              command: ["pi-web-container", "health", "sessiond"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pi-web-container", "health", "sessiond"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts: &mounts
            - name: home
              mountPath: /home/node
            - name: run
              mountPath: /run/pi-web
            - name: tmp
              mountPath: /tmp

        - name: server
          image: ghcr.io/pixeloven/pi-web:latest
          args: ["server"]
          env:
            - name: PI_WEB_SESSIOND_SOCKET
              value: /run/pi-web/sessiond.sock
          envFrom:
            - configMapRef:
                name: pi-web-config
                optional: true
          ports:
            - name: http
              containerPort: 8504
          readinessProbe:
            httpGet:
              path: /api/pi-web/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/pi-web/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts: *mounts
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: pi-web-home
        # Holds only the session daemon socket, shared by both containers.
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
